plugins {
    id "java"
    id "base.base-conventions"
    id "base.application-conventions"
    id "base.fill-build-constants"
    id "viaproxy.publishing-conventions"
    id "net.raphimc.class-token-replacer" version "1.1.7"
    id "xyz.wagyourtail.jvmdowngrader" version "1.3.6"
}

configurations {
    includeInJarJ8
}

// LOCAL PATCH (endstone-proxy). Drop what this build cannot use, because the jar ships to every
// backend and 45 MB of it was payload we never execute. See ../../README.md.
//
// Measured, not guessed: `unzip -l` put ~35 MB in six platform builds of the webrtc-java native
// library. That is the NetherNet transport, for reaching Bedrock servers over Xbox networking. This
// bridge dials one Bedrock server, over RakNet, on 127.0.0.1 — NetherNet is never on the path.
//
// The GUI goes for the same reason: the proxy always launches ViaProxy with `config <file>`, which
// takes the CLI branch of injectedMain, so the Swing look-and-feel is loaded by nothing.
//
// Everything protocol-related stays. ViaVersion, ViaBackwards, ViaRewind, ViaLegacy and
// ViaAprilFools are all registered during ProtocolTranslator.init and between them are what makes
// "any Java version" true; removing them to save a few MB would trade the feature for the file size.
// The cuts themselves are in the dependencies block below, marked LOCAL PATCH: a configuration-level
// `exclude` would have been tidier but does nothing here, because Gradle applies excludes to
// transitive dependencies and every one of these is declared directly.

repositories {
    maven {
        name = "ViaVersion"
        url = "https://repo.viaversion.com"

        content {
            includeGroupByRegex "com\\.viaversion(\\..+)?"
            includeGroupByRegex "net\\.raphimc(\\..+)?"
        }
    }
    maven {
        name = "Lenni0451"
        url = "https://maven.lenni0451.net/everything"

        content {
            includeGroupByRegex "net\\.lenni0451(\\..+)?"
            includeGroupByRegex "net\\.raphimc(\\..+)?"
        }
    }
    maven {
        name = "Minecraft Libraries"
        url = "https://libraries.minecraft.net"

        content {
            includeGroup "com.mojang"
        }
    }
    maven {
        name = "Jitpack"
        url = "https://jitpack.io"

        content {
            includeGroupByRegex "com\\.github\\..+"
        }
    }
}

dependencies {
    includeInJar "com.viaversion:viaversion-common:5.11.1-SNAPSHOT"
    includeInJar "com.viaversion:viabackwards-common:5.11.1-SNAPSHOT"
    includeInJar "com.viaversion:viarewind-common:4.1.3"
    includeInJar "net.raphimc:ViaLegacy:3.0.16"
    includeInJar "com.viaversion:viaaprilfools-common:4.2.2"
    includeInJar "net.raphimc:ViaBedrock:0.0.29-SNAPSHOT"

    includeInJar "com.google.guava:guava:33.6.0-jre"
    includeInJar "com.google.code.gson:gson:2.14.0"
    // LOCAL PATCH (endstone-proxy): the Swing look-and-feel is not shipped. The proxy always starts
    // ViaProxy as `config <file>`, which takes the CLI branch of injectedMain, so no UI class loads.
    compileOnly "com.formdev:flatlaf:3.7.2"
    compileOnly "com.formdev:flatlaf-extras:3.7.2"
    includeInJar "org.apache.commons:commons-lang3:3.20.0"
    includeInJar "commons-io:commons-io:2.22.0"
    includeInJar "net.sf.jopt-simple:jopt-simple:5.0.4"
    includeInJar "org.apache.logging.log4j:log4j-core:2.26.1"
    includeInJar "org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1"
    includeInJar "org.jline:jansi:4.3.1"
    includeInJar("com.mojang:authlib:6.0.58") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }
    includeInJar "net.lenni0451.classtransform:mixinstranslator:1.15.1"
    includeInJar "net.lenni0451.classtransform:mixinsdummy:1.15.1"
    includeInJar "net.lenni0451.classtransform:additionalclassprovider:1.15.1"
    includeInJar "net.lenni0451:Reflect:1.6.4"
    includeInJar "net.lenni0451:LambdaEvents:2.4.2"
    includeInJar("net.lenni0451:MCPing:1.4.4") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    includeInJar "net.lenni0451.commons:swing:1.9.2"
    includeInJar "net.lenni0451.commons:brigadier:1.9.2"
    includeInJar "net.lenni0451.commons:unchecked:1.9.2"
    includeInJar("net.raphimc.netminecraft:all:3.1.6") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    includeInJar("io.netty:netty-codec-haproxy:4.2.16.Final") {
        transitive = false
    }
    includeInJar("io.netty:netty-handler-proxy:4.2.16.Final") {
        transitive = false
    }
    includeInJar("io.netty:netty-codec-socks:4.2.16.Final") {
        transitive = false
    }
    includeInJar("net.raphimc:MinecraftAuth:5.0.2") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    includeInJar("dev.kastle.netty:netty-transport-raknet:1.7.2") {
        exclude group: "io.netty"
    }
    // The NetherNet transport itself stays: it is small, and ViaProxy's config parser resolves
    // NetherNetAddress while reading target-address, so dropping it fails at startup with
    // "Failed to load config ... ClassNotFoundException: NetherNetAddress" before anything binds.
    includeInJar("dev.kastle.netty:netty-transport-nethernet:1.7.2") {
        exclude group: "io.netty"
    }
    // LOCAL PATCH (endstone-proxy): the webrtc-java natives are not shipped. Six platform builds of
    // them were ~35 MB of the 47 MB jar, and they are loaded by exactly one path — dialling a Bedrock
    // server over Xbox networking. This bridge dials one server, over RakNet, on 127.0.0.1, so that
    // path never runs. compileOnly keeps everything compiling against them.
    //
    // Restore the loop below as `includeInJar` if NetherNet is ever actually needed:
    //   ["windows-x86_64", "windows-aarch64", "linux-x86_64", "linux-aarch64", "macos-x86_64",
    //    "macos-aarch64"].each { includeInJar "dev.kastle.webrtc:webrtc-java:1.0.3:$it" }
    compileOnly "dev.kastle.webrtc:webrtc-java:1.0.3"
    includeInJar "gs.mclo:api:6.2.1"
    includeInJar "net.lenni0451:optconfig:1.1.1"

    includeInJarJ8(compileOnly("xyz.wagyourtail.jvmdowngrader:jvmdowngrader:1.3.6"))
    includeInJarJ8 "xyz.wagyourtail.jvmdowngrader:jvmdowngrader-java-api:1.3.6:downgraded-8"
}

application {
    mainClass = "net.raphimc.viaproxy.ViaProxy"
}

jar {
    manifest {
        attributes(
                "Launcher-Agent-Class": application.mainClass
        )
    }
}

downgradeJar {
    dependsOn(configurations.includeInJarJ8)
    from {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        configurations.includeInJarJ8.collect {
            zipTree(it)
        }
    } {
        exclude "META-INF/*.RSA", "META-INF/*.SF", "META-INF/*.DSA"
    }

    downgradeTo = JavaVersion.VERSION_1_8
    ignoreWarningsIn.add("net/lenni0451/commons/httpclient/executor/HttpClientExecutor")
    archiveClassifier = null
    archiveVersion = project.version + "+java8"
}
build.finalizedBy("downgradeJar")

tasks.javadoc.enabled = false
