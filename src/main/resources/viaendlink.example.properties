# ==============================================================================================
#  ViaEndlink — Minecraft: Java Edition players on an Endlink network
# ==============================================================================================
#
# This file belongs to the addon, not to the proxy. Endlink running without ViaEndlink.jar has no
# Java settings at all; delete the jar and this whole folder goes with it.
#
# ViaEndlink embeds ViaProxy (ViaVersion + ViaBackwards + ViaRewind + ViaLegacy + ViaBedrock) in an
# isolated classloader. It accepts Java clients from 1.7.2 to 26.2 and speaks Bedrock to a
# loopback-only listener inside the proxy, so Java players enter Endlink at exactly the same point
# Bedrock players do and get backend switching, permissions and failover with them.

# Turn the addon off without removing the jar.
enabled=true

# Where Java clients connect. This one is public.
host=0.0.0.0
port=25565

# The loopback Bedrock port the embedded translator connects back into. Bound to 127.0.0.1 only and
# never advertised. Self-signed logins are accepted on this port and nowhere else, because the
# translator has no Xbox account to sign with -- so anything able to reach it could claim any name.
# A per-start secret narrows that to this addon; keeping the port on loopback is what makes it work.
bridgePort=19136

# Require Java players to own a real, Mojang-authenticated Minecraft account.
#
# With this on, the translator runs the encryption handshake, checks the session against Mojang,
# kicks anything that fails, and takes the player's name and UUID from Mojang's answer rather than
# from whatever the client claimed. That is what stops both cracked clients and one player joining
# under another player's name.
#
# Turning it off is a real decision, not a convenience: a Java player's identity is derived from
# their name, so anyone able to pick a name can also inherit that player's permissions, backend
# inventory and player data.
onlineMode=true

# Prepended to every Java player's name, so Java and Bedrock players are told apart in chat and on
# the player list. Empty (the default) adds nothing. Examples: * or .
#
# Capped at 4 characters and no whitespace, because the result is the name the backend stores player
# data against and Bedrock names are short. Changing it does not change anyone's identity: it is
# applied after the identity is derived.
namePrefix=

# Path to ViaProxy.jar, relative to this folder. Empty (the default) uses the copy shipped inside
# ViaEndlink.jar, which is extracted here on first start. Set this only to pin your own build.
viaProxyJar=

# ==============================================================================================
#  RESOURCE PACKS
# ==============================================================================================
#
# A Bedrock resource pack cannot be sent to a Java client -- the formats are unrelated. To give Java
# players your textures, convert the pack to Java format, host it somewhere reachable, and name the
# URL here. Java clients are then offered it on join exactly as a vanilla Java server would.
#
# Host it yourself (any static file server will do). Leave empty to offer nothing.
#   resourcePackUrl=https://example.com/packs/network-java.zip
resourcePackUrl=

# Accept the Bedrock server's own resource packs on the player's behalf rather than prompting them.
#
# Leave this on. A Bedrock server that *requires* a pack will otherwise refuse the join outright, and
# the Java client could not have loaded that pack in any case -- the prompt would be a dead end. With
# it on the join proceeds and the player simply sees vanilla textures, or yours from resourcePackUrl.
acceptServerResourcePacks=true

# ==============================================================================================
#  KNOWN LIMITS
# ==============================================================================================
#
# - ViaBedrock speaks Bedrock 1.26.30 and nothing newer, so Java players reach 1.26.40 backends
#   through an upgrade edge this addon registers. Installing the addon therefore also lets real
#   1.26.30 Bedrock clients onto 1.26.40 backends.
# - ViaBedrock is upstream-described as early in development. Expect Java players to be
#   second-class for a while: block entities, containers and some movement are imperfect.
# - Java titles, subtitles, the action bar and name tags are all drawn as a single un-wrapped line.
#   Multi-line Bedrock text in those places is collapsed to one line with a separator (set
#   -Dendstone.bridge.titleLineSeparator on the proxy to change it). Signs do support four lines and
#   are split properly.
# - Custom (addon) items, blocks and entities have no Java equivalent and are not yet mapped. They
#   appear as unknown; the proxy logs "Missing bedrock -> java ... mapping" naming each one.
